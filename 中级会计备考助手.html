<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中级会计备考助手</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --primary:#3b6ef0; --primary-dark:#2b53c4;
    --text:#1f2330; --muted:#7a8194; --line:#e7eaf2; --ok:#1faa6c; --err:#e0524d;
    --warn:#f0a23b; --shadow:0 4px 20px rgba(40,60,120,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6}
  header{background:linear-gradient(135deg,#3b6ef0,#5a4ff0);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(40,60,120,.18)}
  .h-top{display:flex;justify-content:space-between;align-items:center;max-width:880px;margin:0 auto;gap:10px}
  .h-top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
  .countdown{text-align:right;font-size:13px;opacity:.95;cursor:pointer}
  .countdown b{font-size:22px;display:block;line-height:1.1}
  nav{display:flex;gap:4px;max-width:880px;margin:12px auto 0;overflow-x:auto;padding-bottom:2px}
  nav button{flex:0 0 auto;background:rgba(255,255,255,.18);color:#fff;border:none;padding:7px 14px;border-radius:20px;font-size:14px;cursor:pointer;white-space:nowrap;transition:.2s}
  nav button.active{background:#fff;color:var(--primary);font-weight:600}
  main{max-width:880px;margin:0 auto;padding:16px 14px 60px}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h2{margin:0 0 14px;font-size:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:130px;background:linear-gradient(135deg,#f7f9ff,#eef2ff);border-radius:14px;padding:14px;text-align:center}
  .stat .num{font-size:26px;font-weight:700;color:var(--primary)}
  .stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}
  .subj-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .subj-bar button{flex:1;min-width:90px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-size:14px;color:var(--text);transition:.15s}
  .subj-bar button.active{border-color:var(--primary);background:#eef3ff;color:var(--primary);font-weight:600}
  .btn{background:var(--primary);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-size:15px;cursor:pointer;transition:.15s;font-weight:500}
  .btn:hover{background:var(--primary-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#eef1f8;color:var(--text)}
  .btn.sm{padding:7px 13px;font-size:13px}
  .btn.block{display:block;width:100%}
  .q-meta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .tag{background:#eef1f8;color:var(--muted);padding:2px 9px;border-radius:20px;font-size:12px}
  .tag.zhenti{background:#fdeccf;color:#b9791b}
  .tag.moni{background:#e7f0ff;color:#3b6ef0}
  .tag.zhongdian{background:#fde8e7;color:#d4443e}
  .tag.nandian{background:#efe6fb;color:#7a44c4}
  .q-stem{font-size:16px;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
  .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:.12s}
  .opt:hover{border-color:#c3cdec}
  .opt.sel{border-color:var(--primary);background:#eef3ff}
  .opt.correct{border-color:var(--ok);background:#e9f8f1}
  .opt.wrong{border-color:var(--err);background:#fdecea}
  .opt .key{font-weight:700;color:var(--muted);flex:0 0 auto}
  .opt.sel .key,.opt.correct .key{color:var(--primary)}
  .opt.correct .key{color:var(--ok)}
  .opt.wrong .key{color:var(--err)}
  .explain{background:#f7f9ff;border-left:3px solid var(--primary);border-radius:8px;padding:12px;margin-top:12px;font-size:14px;white-space:pre-wrap}
  .explain .res{font-weight:700;margin-bottom:6px}
  .res.ok{color:var(--ok)} .res.no{color:var(--err)}
  .q-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .chap{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .chap:last-child{border-bottom:none}
  .chap input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--primary);cursor:pointer}
  .chap label{flex:1;cursor:pointer;font-size:14px}
  .chap.done label{color:var(--muted);text-decoration:line-through}
  .progbar{height:9px;background:#eef1f8;border-radius:6px;overflow:hidden;margin:6px 0 14px}
  .progbar i{display:block;height:100%;background:linear-gradient(90deg,#3b6ef0,#5a4ff0);transition:.4s}
  .flash{min-height:160px;background:linear-gradient(135deg,#f7f9ff,#eef2ff);border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;justify-content:center;cursor:pointer;font-size:17px}
  .flash small{color:var(--muted);font-size:12px;display:block;margin-bottom:10px}
  .flash .a{margin-top:14px;padding-top:14px;border-top:1px dashed #c3cdec;color:var(--primary);font-weight:600;white-space:pre-wrap}
  label.fl{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  input[type=text],input[type=date],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff}
  textarea{min-height:70px;resize:vertical}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2330;color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:.95}
  .modal{position:fixed;inset:0;background:rgba(20,25,45,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:480px){.grid2{grid-template-columns:1fr}}
  .paper-item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.12s}
  .paper-item:hover{border-color:var(--primary);background:#f7f9ff}
  .paper-item .pi-main{flex:1}
  .paper-item .pi-title{font-weight:600;font-size:15px}
  .paper-item .pi-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .warn-box{background:#fff6ea;border-left:3px solid var(--warn);border-radius:8px;padding:12px;font-size:14px;margin-bottom:10px}
  .urgent-box{background:#fdecea;border-left:3px solid var(--err);border-radius:8px;padding:12px;font-size:14px;margin-bottom:10px}
  .point-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}
  .point-row:last-child{border-bottom:none}
  .point-row .cnt{flex:0 0 auto;background:#fde8e7;color:#d4443e;font-size:12px;padding:2px 9px;border-radius:20px}
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;background:#eef1f8;border:none;padding:9px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text)}
  .seg button.active{background:var(--primary);color:#fff;font-weight:600}
  .disclaimer{font-size:12px;color:var(--muted);background:#f7f9ff;border-radius:10px;padding:10px 12px;margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="h-top">
    <h1>📘 中级会计备考助手</h1>
    <div class="countdown" id="countdown" title="点击修改考试日期">
      <b id="cdDays">--</b>
      <span>距考试天数</span>
    </div>
  </div>
  <nav id="nav">
    <button data-view="home" class="active">🏠 首页</button>
    <button data-view="quiz">📝 章节刷题</button>
    <button data-view="paper">📋 套题试卷</button>
    <button data-view="wrong">❌ 错题本</button>
    <button data-view="flash">🗂 闪卡复习</button>
    <button data-view="plan">✅ 学习计划</button>
    <button data-view="add">➕ 添加题目</button>
    <button data-view="data">⚙️ 数据备份</button>
  </nav>
</header>

<main>
  <section id="view-home"></section>
  <section id="view-quiz" hidden></section>
  <section id="view-paper" hidden></section>
  <section id="view-wrong" hidden></section>
  <section id="view-flash" hidden></section>
  <section id="view-plan" hidden></section>
  <section id="view-add" hidden></section>
  <section id="view-data" hidden></section>
</main>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="box">
    <h2 style="margin-top:0">设置考试日期</h2>
    <label class="fl">考试日期</label>
    <input type="date" id="examDate">
    <div class="hint">2026年中级会计考试一般在 9 月初。请按准考证为准修改。</div>
    <div style="display:flex;gap:10px;margin-top:18px">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" style="flex:1" onclick="saveExamDate()">保存</button>
    </div>
  </div>
</div>

<script>
/* ===================== 科目定义 ===================== */
const SUBJECTS = {
  shiwu:   {name:"中级会计实务", short:"实务"},
  caiguan: {name:"财务管理",     short:"财管"},
  jingjifa:{name:"经济法",       short:"经济法"},
};

/* ===================== 章节列表 ===================== */
const PLAN_CHAPTERS = {
  shiwu:["第1章 总论","第2章 存货","第3章 固定资产","第4章 无形资产","第5章 投资性房地产","第6章 长期股权投资","第7章 金融资产","第8章 收入","第9章 职工薪酬","第10章 所得税","第11章 财务报告"],
  caiguan:["第1章 总论","第2章 财务管理基础","第3章 预算管理","第4章 筹资管理(上)","第5章 筹资管理(下)","第6章 投资管理","第7章 营运资金管理","第8章 成本管理","第9章 收入与分配管理","第10章 财务分析与评价"],
  jingjifa:["第1章 总论","第2章 公司法律制度","第3章 合伙企业法律制度","第4章 金融法律制度","第5章 合同法律制度","第6章 增值税法律制度","第7章 企业所得税法律制度","第8章 相关税收法律制度"],
};

/* ===================== 章节题库 =====================
   字段说明：
   type: single单选 / multi多选 / judge判断
   answer: 单选&判断为字母字符串; 多选为字母数组
   src: "真题" / "模拟题"
   level: "重点" / "难点" / "一般"
   point: 知识点（用于错题分析与重点学习提示）
   ⚠️ 税率、法条以当年官方教材为准
====================================================== */
const CHAPTER_QUESTIONS = [
  /* —— 中级会计实务 —— */
  {id:"s_cun_1",subject:"shiwu",chapter:"第2章 存货",point:"存货可变现净值",src:"模拟题",level:"重点",type:"single",
   stem:"企业在确定存货的可变现净值时，下列各项中不应作为计算依据的是（　）。",
   options:["产品的估计售价","至完工估计将发生的成本","估计的销售费用及相关税费","存货的历史成本"],
   answer:"D",
   explain:"可变现净值 = 估计售价 − 至完工估计将发生的成本 − 估计的销售费用及相关税费。存货的“历史成本”不是可变现净值的计算依据，而是用来与可变现净值比较、判断是否计提跌价准备。"},
  {id:"s_gu_1",subject:"shiwu",chapter:"第3章 固定资产",point:"固定资产折旧",src:"模拟题",level:"重点",type:"single",
   stem:"关于固定资产折旧，下列说法正确的是（　）。",
   options:["当月增加的固定资产，当月计提折旧","当月减少的固定资产，当月不计提折旧","已提足折旧仍继续使用的，不再计提折旧","提前报废的固定资产应补提折旧"],
   answer:"C",
   explain:"规则：当月增加的当月不提、下月起提；当月减少的当月仍提、下月起停。已提足折旧仍使用的不再计提；提前报废也不补提折旧。故C正确。"},
  {id:"s_wu_1",subject:"shiwu",chapter:"第4章 无形资产",point:"研究与开发支出",src:"模拟题",level:"重点",type:"judge",
   stem:"判断：企业内部研究开发项目，研究阶段的支出应予以资本化，开发阶段的支出应费用化计入当期损益。",
   options:["正确","错误"],answer:"B",
   explain:"错误，说反了。研究阶段支出应“费用化”计入当期损益；开发阶段支出在满足资本化条件时才“资本化”确认为无形资产。"},
  {id:"s_tou_1",subject:"shiwu",chapter:"第5章 投资性房地产",point:"投资性房地产计量模式",src:"模拟题",level:"难点",type:"judge",
   stem:"判断：采用公允价值模式计量的投资性房地产，不计提折旧或摊销，但应按期与公允价值比较计提减值。",
   options:["正确","错误"],answer:"B",
   explain:"错误。公允价值模式下不计提折旧或摊销，也不计提减值，期末以公允价值计量，其变动计入“公允价值变动损益”。"},
  {id:"s_chang_1",subject:"shiwu",chapter:"第6章 长期股权投资",point:"成本法与权益法",src:"模拟题",level:"难点",type:"single",
   stem:"投资方对被投资单位能够实施控制的长期股权投资，在个别财务报表中应采用（　）核算。",
   options:["成本法","权益法","公允价值法","摊余成本法"],
   answer:"A",
   explain:"能够“控制”（一般为子公司）的，个别报表采用成本法核算；具有“共同控制或重大影响”（合营、联营企业）的采用权益法。"},
  {id:"s_jin_1",subject:"shiwu",chapter:"第7章 金融资产",point:"金融资产分类",src:"模拟题",level:"难点",type:"multi",
   stem:"某项金融资产分类为“以摊余成本计量”，应同时满足的条件有（　）。",
   options:["管理该资产的业务模式是以收取合同现金流量为目标","合同现金流量特征仅为本金和以本金为基础的利息支付","以公允价值计量且其变动计入当期损益","持有目的是近期出售获利"],
   answer:["A","B"],
   explain:"以摊余成本计量需同时满足：①业务模式为“收取合同现金流量”；②通过SPPI测试，即合同现金流量仅为本金和利息。CD描述的是以公允价值计量且变动计入当期损益的金融资产。"},
  {id:"s_shou_1",subject:"shiwu",chapter:"第8章 收入",point:"收入确认五步法",src:"模拟题",level:"重点",type:"judge",
   stem:"判断：新收入准则下，企业确认收入采用“五步法”模型，最后一步是在履行履约义务（即客户取得相关商品控制权）时确认收入。",
   options:["正确","错误"],answer:"A",
   explain:"正确。五步法：①识别合同 ②识别履约义务 ③确定交易价格 ④分摊交易价格 ⑤履行履约义务时确认收入。控制权转移是确认收入的核心标志。"},
  {id:"s_suo_1",subject:"shiwu",chapter:"第10章 所得税",point:"暂时性差异",src:"模拟题",level:"难点",type:"single",
   stem:"资产的账面价值大于其计税基础，将产生（　）。",
   options:["应纳税暂时性差异，确认递延所得税负债","可抵扣暂时性差异，确认递延所得税资产","永久性差异","不产生暂时性差异"],
   answer:"A",
   explain:"资产账面价值>计税基础 → 应纳税暂时性差异 → 递延所得税负债；资产账面价值<计税基础 → 可抵扣暂时性差异 → 递延所得税资产。负债项目则相反。"},
  {id:"s_bao_1",subject:"shiwu",chapter:"第11章 财务报告",point:"财务报表组成",src:"模拟题",level:"重点",type:"multi",
   stem:"一套完整的财务报表至少应当包括（　）。",
   options:["资产负债表","利润表","现金流量表","所有者权益变动表及附注"],
   answer:["A","B","C","D"],
   explain:"完整的财务报表包括：资产负债表、利润表、现金流量表、所有者权益（股东权益）变动表以及附注。四张报表加附注缺一不可。"},

  /* —— 财务管理 —— */
  {id:"c_li_1",subject:"caiguan",chapter:"第10章 财务分析与评价",point:"获利能力指标",src:"模拟题",level:"重点",type:"single",
   stem:"下列财务比率中，用于反映企业获利能力的是（　）。",
   options:["流动比率","资产负债率","总资产净利率","存货周转率"],
   answer:"C",
   explain:"总资产净利率=净利润/平均资产总额，反映获利能力。流动比率→短期偿债能力；资产负债率→长期偿债能力；存货周转率→营运能力。"},
  {id:"c_shi_1",subject:"caiguan",chapter:"第2章 财务管理基础",point:"货币时间价值系数",src:"模拟题",level:"重点",type:"single",
   stem:"已知（F/P,10%,5）=1.6105，则复利现值系数（P/F,10%,5）约为（　）。",
   options:["0.6209","1.6105","0.5645","0.7513"],
   answer:"A",
   explain:"复利现值系数与复利终值系数互为倒数：(P/F,10%,5)=1/(F/P,10%,5)=1/1.6105≈0.6209。"},
  {id:"c_gan_1",subject:"caiguan",chapter:"第2章 财务管理基础",point:"经营杠杆",src:"模拟题",level:"重点",type:"judge",
   stem:"判断：其他条件不变时，经营杠杆系数（DOL）越大，企业的经营风险越大。",
   options:["正确","错误"],answer:"A",
   explain:"正确。DOL越大，息税前利润对销售量变动越敏感，经营风险越大。DOL=基期边际贡献/基期息税前利润。"},
  {id:"c_bian_1",subject:"caiguan",chapter:"第8章 成本管理",point:"变动成本与固定成本",src:"模拟题",level:"重点",type:"multi",
   stem:"下列成本项目中，通常属于变动成本的有（　）。",
   options:["直接材料","按产量计酬的直接人工","直线法计提的厂房折旧","管理人员固定月薪"],
   answer:["A","B"],
   explain:"变动成本随业务量成正比变动：直接材料、计件（按产量）人工属于变动成本。直线法折旧、固定月薪不随产量变动，属于固定成本。"},

/* 判断某错题对应章节是否“在出错之后已学习” */
function chapterStudiedAfter(subject,chapter,sinceDate){
  if(!chapter)return false;
  const chs=PLAN_CHAPTERS[subject]||[];
  for(let i=0;i<chs.length;i++){
    if(chs[i]===chapter || chs[i].includes(chapter) || chapter.includes(chs[i])){
      const key=subject+"_"+i, d=state.planDate[key];
      if(d && d>=sinceDate) return true;
    }
  }
  return false;
}

function analyzeWrong(){
  // 汇总两类错题 → 知识点统计 + 加强提示
  const points={}; const urgent=[];
  [["章节",state.wrong],["套题",state.wrongPaper]].forEach(([scope,map])=>{
    Object.keys(map).forEach(id=>{
      const q=getQ(id); if(!q)return;
      const rec=map[id];
      const pt=q.point||q.chapter||"其他";
      if(!points[pt])points[pt]={cnt:0,subject:q.subject};
      points[pt].cnt+=rec.c||1;
      // 加强提示：超过URGE_DAYS天 且 对应章节未在出错后学习
      const since=rec.added||todayStr();
      if(daysSince(since)>=URGE_DAYS && !chapterStudiedAfter(q.subject,q.chapter,since)){
        urgent.push({pt,subject:q.subject,chapter:q.chapter,days:daysSince(since),scope});
      }
    });
  });
  const ranked=Object.entries(points).map(([pt,o])=>({pt,...o})).sort((a,b)=>b.cnt-a.cnt);
  return {ranked,urgent};
}

function renderQuestion(targetView){
  const view = targetView || (quizScope==="paper"?"paper":"quiz");
  const host = $("#view-"+view);
  if(quizIdx>=quizPool.length){ renderDone(view); return; }
  const q=quizPool[quizIdx];
  curSelection=(q.type==="multi")?[]:null;
  const keys=["A","B","C","D","E","F"];
  const typeName={single:"单选题",multi:"多选题",judge:"判断题"}[q.type];
  host.innerHTML=`<div class="card">
    <div class="q-meta">
      <span class="tag">${SUBJECTS[q.subject].short}</span>
      <span class="tag">${typeName}</span>
      ${srcTag(q.src)} ${levelTag(q.level)}
      ${q.chapter?`<span class="tag">${escapeHtml(q.chapter)}</span>`:""}
      ${q.point?`<span class="tag">${escapeHtml(q.point)}</span>`:""}
      <span style="margin-left:auto;color:var(--muted)">${quizIdx+1}/${quizPool.length}</span>
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div id="opts">${q.options.map((o,i)=>`<div class="opt" data-key="${keys[i]}" onclick="pick('${keys[i]}','${q.type}')">
      <span class="key">${keys[i]}</span><span>${escapeHtml(o)}</span></div>`).join("")}</div>
    <div id="explainBox"></div>
    <div class="q-actions">
      <button class="btn" id="submitBtn" onclick="submitAnswer('${view}')">提交答案</button>
      <button class="btn ghost" id="nextBtn" onclick="quizIdx++;renderQuestion('${view}')" hidden>下一题 →</button>
      <button class="btn ghost sm" onclick="show('${quizScope==='paper'?'paper':'quiz'}')">退出</button>
    </div></div>`;
}
function pick(key,type){
  if($("#submitBtn").hidden)return;
  if(type==="multi"){ const i=curSelection.indexOf(key); if(i>=0)curSelection.splice(i,1); else curSelection.push(key); }
  else curSelection=key;
  document.querySelectorAll("#opts .opt").forEach(el=>{
    const k=el.dataset.key, on=type==="multi"?curSelection.includes(k):curSelection===k;
    el.classList.toggle("sel",on);
  });
}
function submitAnswer(view){
  const q=quizPool[quizIdx];
  if((q.type==="multi"&&!curSelection.length)||(q.type!=="multi"&&!curSelection)){toast("请先选择答案");return;}
  let correct;
  if(q.type==="multi"){ correct=[...q.answer].sort().join("")===[...curSelection].sort().join(""); }
  else correct=curSelection===q.answer;

  state.answered++; if(correct)state.correct++;
  runStat.total++; if(correct)runStat.correct++;
  const ans=q.type==="multi"?q.answer:[q.answer];
  document.querySelectorAll("#opts .opt").forEach(el=>{
    const k=el.dataset.key;
    if(ans.includes(k))el.classList.add("correct");
    else if((q.type==="multi"?curSelection:[curSelection]).includes(k))el.classList.add("wrong");
  });

function bulkImportJsonText(content){
  try{
    let arr=JSON.parse(content); if(!Array.isArray(arr))throw 0;
    const defSubj=$("#bSubj").value; let n=0;
    arr.forEach((q,i)=>{
      if(!q.stem||!q.answer)return;
      const subject=subjKey(q.subject)||defSubj;
      const type=q.type||(Array.isArray(q.answer)?"multi":((q.options&&q.options.length<=2)?"judge":"single"));
      state.custom.push({id:"j"+Date.now()+"_"+i,subject,chapter:q.chapter||"",point:q.point||"",

function subjKey(s){
  if(!s)return null; s=(""+s).trim();
  for(const k in SUBJECTS){ if(k===s||SUBJECTS[k].name===s||SUBJECTS[k].short===s||s.includes(SUBJECTS[k].short))return k; }
  if(s.includes("实务"))return "shiwu";
  if(s.includes("财")||s.includes("财管"))return "caiguan";
  if(s.includes("经济")||s.includes("法"))return "jingjifa";
  return null;
}
/* 文本批量解析器：返回 {ok:[题目], errs:[问题描述]} */
function parseBulk(text,defSubj){
  const ok=[],errs=[];
  // 用空行或 --- 分隔题块
  const blocks=text.split(/\n\s*\n|\n-{3,}\n/).map(b=>b.trim()).filter(Boolean);
  blocks.forEach((blk,bi)=>{
    const lines=blk.split("\n").map(l=>l.trim()).filter(Boolean);
    if(!lines.length)return;
    let stem="",options=[],ansRaw="",explain="",chapter="",point="",src="模拟题",level="一般",subject=defSubj,type=null;
    lines.forEach(line=>{
      let m;
      if((m=line.match(/^([A-F])\s*[.．、)）:：]\s*(.+)$/))){ options.push(m[2].trim()); return; }
      if((m=line.match(/^(答案|正确答案|答)\s*[:：]?\s*(.+)$/))){ ansRaw=m[2].trim(); return; }
      if((m=line.match(/^(解析|分析|答案解析)\s*[:：]?\s*(.*)$/))){ explain=m[2].trim(); return; }
      if((m=line.match(/^(章节|章)\s*[:：]\s*(.+)$/))){ chapter=m[2].trim(); return; }
      if((m=line.match(/^(知识点|考点)\s*[:：]\s*(.+)$/))){ point=m[2].trim(); return; }
      if((m=line.match(/^(来源)\s*[:：]\s*(.+)$/))){ src=m[2].includes("真")?"真题":"模拟题"; return; }
      if((m=line.match(/^(难度|重要程度|程度)\s*[:：]\s*(.+)$/))){ const v=m[2].trim(); level=/重点|难点|一般/.test(v)?v.match(/重点|难点|一般/)[0]:"一般"; return; }
      if((m=line.match(/^(科目)\s*[:：]\s*(.+)$/))){ subject=subjKey(m[2])||defSubj; return; }
      // 否则作为题干（取第一条）
      if(!stem){
        let t=line;
        const tm=t.match(/^[【\[(（]?\s*(单项选择题|多项选择题|单选题|多选题|判断题|单项选择|多项选择|单选|多选|判断)\s*[】\])）]?\s*[、.．:：]?\s*/);
        if(tm){ const w=tm[1]; type=/多/.test(w)?"multi":(/判断/.test(w)?"judge":"single"); t=t.slice(tm[0].length); }
        stem=t.trim();
      } else { stem+=" "+line; } // 题干续行
    });
    if(!stem){ errs.push(`第${bi+1}块：缺题干`); return; }
    if(!ansRaw){ errs.push(`第${bi+1}块「${stem.slice(0,12)}…」：缺答案`); return; }
    // 自动判型
    if(!type){
      if(options.length<=2 && /^(对|错|正确|错误|√|×|T|F|A|B)$/i.test(ansRaw)) type="judge";
      else{ const letters=ansRaw.toUpperCase().replace(/[^A-F]/g,""); type=letters.length>1?"multi":"single"; }
    }
    let answer;
    if(type==="judge"){
      options=options.length>=2?options:["正确","错误"];
      answer=/对|正确|√|T|^A$/i.test(ansRaw)?"A":(/错|×|F|^B$/i.test(ansRaw)?"B":null);
      if(!answer){ errs.push(`第${bi+1}块「${stem.slice(0,12)}…」：判断题答案应为 对/错`); return; }
    }else{
      const letters=ansRaw.toUpperCase().replace(/[^A-F]/g,"").split("");
      if(!letters.length){ errs.push(`第${bi+1}块「${stem.slice(0,12)}…」：答案无效`); return; }
      if(options.length<2){ errs.push(`第${bi+1}块「${stem.slice(0,12)}…」：选项不足2个`); return; }
      const maxIdx=options.length-1, keys=["A","B","C","D","E","F"];
      for(const L of letters){ if(keys.indexOf(L)>maxIdx){ errs.push(`第${bi+1}块「${stem.slice(0,12)}…」：答案${L}超出选项范围`); return; } }
      answer=type==="multi"?letters:letters[0];
    }
    ok.push({subject,chapter,point,src,level,type,stem,options,answer,explain});
  });
  return {ok,errs};
}

/* ===================== 数据备份 ===================== */
function renderData(){
  $("#view-data").innerHTML=`
    <div class="card"><h2>⚙️ 数据备份与恢复</h2>
      <p class="hint">学习记录、错题、自定义题目都存在本设备浏览器里。换设备或清缓存前请先导出备份。</p>
      <button class="btn block" style="margin-bottom:10px" onclick="exportData()">📤 导出备份文件</button>
      <label class="btn ghost block" style="margin-bottom:10px;text-align:center">📥 导入备份文件<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label>
      <button class="btn ghost block" style="color:var(--err)" onclick="resetData()">🗑 清空所有数据</button></div>
    <div class="card"><h2>📊 学习统计</h2>
      <div class="row">
        <div class="stat"><div class="num">${state.answered}</div><div class="lbl">累计做题</div></div>
        <div class="stat"><div class="num">${state.answered?Math.round(state.correct/state.answered*100):0}%</div><div class="lbl">正确率</div></div>
        <div class="stat"><div class="num">${Object.keys(state.wrong).length}</div><div class="lbl">章节错题</div></div>
        <div class="stat"><div class="num">${Object.keys(state.wrongPaper).length}</div><div class="lbl">套题错题</div></div>
      </div></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="中级会计备考备份_"+todayStr()+".json"; a.click(); toast("已导出备份");
}
function importData(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{state=JSON.parse(r.result);saveState();toast("✅ 导入成功");refreshCountdown();show('home');}catch(err){toast("文件格式错误");}};
  r.readAsText(f);
}
function resetData(){ if(confirm("确定清空所有学习数据吗？此操作不可恢复！建议先导出备份。")){localStorage.removeItem(LS_KEY);location.reload();} }

/* ===================== 考试日期 ===================== */
$("#countdown").onclick=()=>{$("#examDate").value=state.examDate;$("#modal").classList.add("show");};
function closeModal(){$("#modal").classList.remove("show");}
function saveExamDate(){const v=$("#examDate").value;if(!v)return;state.examDate=v;saveState();refreshCountdown();closeModal();toast("已更新考试日期");if(!$("#view-home").hidden)renderHome();}

/* ===================== 启动 ===================== */
refreshCountdown();
renderHome();
</script>
